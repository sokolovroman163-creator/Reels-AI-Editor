name: Reels AI Android

on:
  workflow_dispatch:
    inputs:
      rebuild_upstream:
        description: 'Rebuild the pinned unmodified upstream APK before our APK'
        type: boolean
        default: false
  push:
    branches: [main, reels-ai-editor]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

permissions:
  contents: read
  actions: read

concurrency:
  group: reels-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-upstream:
    name: Verify successful clean upstream build
    if: ${{ !inputs.rebuild_upstream }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const upstream = 'aac45890d7191d107f1122e1dde8daf9f120b5cf';
            const proofCommit = '4b734477f0288cc0ac4427d526f0617e1ccd954e';
            const job = (await github.rest.actions.getJobForWorkflowRun({owner, repo, job_id:111465868433})).data;
            if (job.run_id !== 37212332391 || job.conclusion !== 'success')
              throw new Error('Clean upstream build evidence is unavailable. Dispatch with rebuild_upstream enabled.');
            const file = (await github.rest.repos.getContent({owner, repo, path:'.github/workflows/reels-ai-android.yml', ref:proofCommit})).data;
            const yaml = Buffer.from(file.content, 'base64').toString('utf8');
            if (!yaml.includes('source_repository: CutWire-Studios/Drift') || !yaml.includes('source_ref: '+upstream))
              throw new Error('Upstream provenance does not match the pinned source.');
            await core.summary.addHeading('Clean upstream APK build verified')
              .addRaw('Pinned source: `'+upstream+'`. Full APK compilation and signature verification succeeded before AI changes.\n\n')
              .addLink('Original successful build job', job.html_url)
              .addRaw('\n\nDispatch with rebuild_upstream enabled to repeat the full baseline build.').write();

  baseline:
    name: Unmodified upstream APK
    if: ${{ inputs.rebuild_upstream }}
    uses: ./.github/workflows/reels-android-build.yml
    with:
      source_repository: CutWire-Studios/Drift
      source_ref: aac45890d7191d107f1122e1dde8daf9f120b5cf
      package_name: org.cutwire.drift
      app_name: Drift
      artifact_name: Drift-upstream-arm64-v8a
    # Baseline always uses a disposable test key, never our release key.

  reels:
    name: Reels AI Editor APK
    needs: [verified-upstream, baseline]
    if: ${{ !cancelled() && (needs.verified-upstream.result == 'success' || needs.baseline.result == 'success') }}
    uses: ./.github/workflows/reels-android-build.yml
    with:
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      package_name: app.reelsai.editor
      app_name: Reels AI Editor
      artifact_name: ReelsAI-arm64-v8a
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
